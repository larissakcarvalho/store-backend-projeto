name: Backend CI

on:
  push:
    paths:
      - '**'
  pull_request:
    paths:
      - '**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: digital_store_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: .
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: digital_store
      DB_USER: root
      DB_PASSWORD: root
      TEST_DB_NAME: digital_store_test
      JWT_SECRET: ci-test-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run db:migrate -- --env test
      - run: npm run db:seed -- --env test
      - run: npm run test:db
        env:
          RUN_DB_TESTS: 'true'
